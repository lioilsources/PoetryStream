name: Release iOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Release iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: poetry_stream
        run: flutter pub get

      - name: Build iOS (debug, no codesign)
        working-directory: poetry_stream
        run: flutter build ios --debug --no-codesign

      - name: Package as ZIP
        run: |
          cd poetry_stream/build/ios/iphoneos
          zip -r "$OLDPWD/PoetryStream-${{ github.ref_name }}-iOS-debug.zip" Runner.app

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PoetryStream-${{ github.ref_name }}-iOS-debug.zip
          name: PoetryStream ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
