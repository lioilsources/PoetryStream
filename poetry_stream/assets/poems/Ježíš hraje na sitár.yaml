- title: "JEŽÍŠ HRAJE NA SITÁR: obnažená kolena mladých žen"
  text: |
    obnažená kolena mladých žen
    pohanské Slunce závidí
    tanec je roztroušená skleróza v panenkách očí
    hledejte nejprve Boží království
    a vše ostatní vám bude přidáno
    nebe je ocelové
    načichlé válkou, Natálie
    hvězdy se třpytí jako stříbrné štíty
    naděje v srdcích má plný zásobník
    nikdo nemá odvahu hrát po něm druhou větu té Božské symfonie
    ale Bůh dal tu milost Luciferovi i nám
    záleží na nás
    jaký bude sled harmonií
    smyčce a sitár?
    kdo zvolil onu kombinaci?
    to hřích s nímž rostou a padají království 

- title: "JEŽÍŠ HRAJE NA SITÁR: možná že to bylo zakázáno"
  text: |
    možná že to bylo zakázáno
    ale tady a teď se stalo gloriolou skutku
    nebylo nic co by vyrvalo labuť labuti
    nebyl nikdo kdo by to udělal byť jen pohybem hlavou či oka
    nebyl ani čas a prostor
    zdánlivost si oblékla kominickou uniformu Natálie
    a sklo řazené do vitráží se vysypalo
    do dlaní sebevrahů
    bylo to sklo chrámových oken
    bylo to milosrdné sklo
    možná že to bylo pod zákonem
    a narodit se a zemřít stalo se denním chlebem
    mešním vínem
    octem i solí
    kremrolí Putinových dobrodružných pohádek
    kde není o labutích ani zmínka
    jediné co platí
    jsou zimníky a zamrzlá jezera

- title: "JEŽÍŠ HRAJE NA SITÁR: vyprahlá země volá po dešti"
  text: |
    vyprahlá země volá po dešti
    vražda ticha co do nitra temnotu vláčí
    Ábelovy hoaxy
    srny v labyrintu stromů
    a paroží naděje na odivu příze z vyčesaných vlasů pisálka
    chromá oduší si pomalu zvykají
    zvykají na zvracející těla

- title: "JEŽÍŠ HRAJE NA SITÁR: Klavíristka potopená v neoprenu ve vodě v oáze"
  text: |
    i oázy mají svá dna Natálie
    a klavír příliš málo kláves
    příliš málo strun
    a já bych tak rád rozladil trojstrunní každého tónu
    udělal z jednoho tři neb aspoň dva
    ale takové klavíry přináší jen andělé
    a zlatá fata morgana dál leští sloupy svého divadla

- title: "JEŽÍŠ HRAJE NA SITÁR: píši ti z pekla"
  text: |
    píši ti z pekla
    a není cesty zpátky
    ta touha vleklá
    nevěří na pohádky

    a přesto drží
    mě jako pes svou kost
    v poťouchlé strži
    není chuť na radost

    píši ti o tom
    že tvoje tóny voní
    proč? prostě proto
    jsi jako poník

    miloučký čistý
    a já jsem, hřebec, stár
    žluté jsou listy
    knihy mé lásky Dar

    sýčků - těch moudrých
    jak mozky elefantů
    u cesty kobry
    hovoří v esperantu

    rozumím dobře
    a vůbec nemám šajn
    kdy skončí pohřeb
    kdy odpustí si Kain
