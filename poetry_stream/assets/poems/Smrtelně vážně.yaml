product_id: poetrystream_smrtelne_vazne
title: Smrtelně vážně
poems:
- title: "SMRTELNĚ VÁŽNĚ: Havel zpívá"
  text: |
    zastavil se čas
    zastavil se čas
    a pak se rozběhl šílenou rychlostí
    komouši hledali po kapsách hodinky
    někteří tušili a se svěšenou hlavou
    klopili zrak
    někteří věděli
    ale ti taky
    rudé vlajky na půl žerdi
    a cinkání klíčů
    psí čumáky na balkónech
    a dole?
    - My nejsme děti
    my nejsme děti
    my to chceme taky -
    dav
    Svatý Václav vše bedlivě sledoval
    neuniklo mu slunce v očích tisíců
    Vašku též jsem ti věřil
    Havel na Hrad
    Havel na Hrad
    a věřím
    zvětralá hornina ztratila podnos historie
    píší se dějiny návratu
    Kocáb tehdy poslal ruské tanky zpátky dom'
    kdo mohl tušit
    že se o třicet let později objeví na Ukrajině
    - nebudu vám lhát
    řekl jsi
    a nelhals
    za nocí jsi zpíval
    neboť na Hradě se svítilo
    tětiva s šípem pravdy byla napnutá
    čekala 40 let na vteřinu střely
    střely jež protla ústavu naší země
    srdce naší milované krajiny
    mnohé to zranilo
    a pro mnohé Amorův byl to šíp
    někteří klopili zraky
    a svěsili hlavu
    převlékli kabáty
    někteří permanentně usínali v demokracii
    a permanentně se budili v diktatuře
    naší malé diktatuře
    soudruzi nad devadesát let
    říkali cosi o domluveném převratu
    ale byli to studenti
    jež dostali natřískáno po hubě
    později se Doubek zabil v autě
    protože jinak to nešlo jak říkal Jakeš
    a Mečiar s Klausem si rozdělili republiku
    ale tys Vašku zpíval
    zpíval jsi u piva
    ale jako prezident jsi striktně dodržoval termíny
    mluvil jsi v americkém parlamenntu
    demokratickou zemi jsi za potlesku učil demokracii
    hle označili tě za proamerického pravdoláskaře
    konspirační žvásty vítězily i po třiceti letech
    kdy Rusko opět vystrčilo růžky
    ba co dím - rohy
    a začalo okupovat naše slovanské bratry
    prolévat slovanskou krev
    ruský bratr proti bratru ukrajinskému
    blábolící Putin
    blábolící cosi o bratrské pomoci
    jako před sedmdesáti lety u nás
    vím Vašku
    už tu nejsi
    odešels tam odkud se nevrací
    a ti dva šašci po tobě se nezmohli na nic pro národ
    chvástali se jen svými pseudozásluhami
    kradli
    osvobozovali zloděje
    mstili se
    lhali
    pili v přímém přenosu
    posraní strachy kolaborovali
    jednou budou nazváni vlastizrádci
    i já jsem jezdíval do Prahy za svou láskou
    tehdá to nevyšlo
    možná ani tobě tak jak sis přál
    ale stále slyším tvůj zpěv:
    pravda a láska musí zvítězit nad lží a nenávistí
    slibuji že se o ti budu snažit
    ve jménu tvého poslání
    musíme bojovat
    musíme posílat Ukrajině zbraně
    musíme se semknout
    přestože byla do vyšších pater zavlečena
    hrubost
    lež
    sprostota dlaždičů
    a chlast
    tobě na Hradě vždy visela standarta Pravda vítězí
    ano, veritas vincit forever
    a Rudému visely tam rudé trenýrky
    a na Úlisného byl spáchán atentát
    airsoftovou pistolí
    hle holt jaký prezident - takový atentát
    jen tys mi nebyl k smíchu
    protože jsi přemýšlel o člověku
    nikoli o svém prospěchu
    měl jsi vizi
    za kterou jsi šel
    ačkoli ti mnozí bránili
    počkal sis vždy a pak pokračoval dál
    jsi moje Amerika Vašku
    jsi moje knihovna
    můj mír a vlast
    děkuji

- title: "SMRTELNĚ VÁŽNĚ: každý jsme nějaký"
  text: |
    každý jsme nějaký
    možná jsem ve Vašich očích ubožák
    ale já vím že jsem obdarován i těma Vašima očima
    vdechuji lásku kde se dá
    každý jsme nějaký
    ale všichni používáme tytéž elektrické spotřebiče
    jste unikát jako já jsem
    jste člověk jako já jsem
    jste oltář jako já jsem
    co na tom že život plyne?
    vždyť žádná vigilie netrvá věčně
    díky Bohu
    a možná díky nám
    usínám na hvězdách
    pod nimi i v nich
    dnes už boj nevzdávám
    dnes už ne
    snad taky kvůli Vám
    snad díky Bohu
    snad prostě z prázdnoty
    počkejte počkejte prázdnota je motor
    bič i víra
    slíbil jsem
    odezírám ze rtů Krista
    jsou také světlá místa
    světlá a hřejivá
    a každému tam někde hoří svíčka
    a jednou dohoří
    piráti v zámoří
    mávají na n@s
    na všechny
    my přijdem blíž až dále budeme,
    bezejmenní
    z lásky zubních ordinací ošaceni
    plombami, Božím puncem
    každý jsme nějaký
    každý jsme Sluncem
    pro sebe
    pro druhé
    pro kruhy pod očima...

- title: "SMRTELNĚ VÁŽNĚ: upadám do pustých melancholií"
  text: |
    upadám do pustých melancholií
    begónie mi rostou v krku
    chameleoni v mozku se množí
    jsem zázrak přírody
    autor nehynoucích malých prostých smrtí
    jsem na počátku cesty
    která v drti skla rozedírá nahá chodidla
    styk se zemí je možný jen v psích útulcích
    v krvi plave cosi žárlivého a doufajícího
    do života leden se opřel
    a učinil mě krásným
    ach Bože samota je vzácná jak perské koření
    a šlahouny nitra neumlčitelné jsou
    je čas ovulace
    čas milenců
    čas hvězd
    ruce sevřeny jsou v pěst
    jako ryby v oleji v intimitě krásy
    hledají starý rodný dům a pec
    paže jsou obnaženy
    a rostou do monumentálních pomníků jedné dávné epochy
    herec je klidný
    herec nosí masku
    svůj smartphone tahá na provázku
    v inflaci zla
    v té destrukci mýtů
    kde pářili ss myši s krtky
    a každý musel na posudky
    každý zvracel bláto
    ó Achillova pato
    vítězíš
    ale noc odhalí tvé pavučiny s kapkami rosy
    pak změní se sklon jitřní osy
    a zhyne spolknut jeden další sen

- title: "SMRTELNĚ VÁŽNĚ: moc je mi dovoleno"
  text: |
    moc je mi dovoleno
    jsem nekonečný
    bez ní i s ní
    léčím se
    stopy jsou zaváté
    zůstává ticho
    myšlenky zhasly
    jak hvězda nad Betlémem

- title: "SMRTELNĚ VÁŽNĚ: viděl jsem netřesky v plamenech"
  text: |
    viděl jsem netřesky v plamenech
    v krajině půlnočních ryb
    ve znameních spásy
    v trpělivosti beze zbraní
    v duchovním podnikání
    delfíny hledající inspiraci viděl jsem
    zřel jsem kterak píší básně
    zrozeni v inteligenci
    a ke zpoždění
    viděl jsem světlo
    a ty v něm Ivano
    sestupovala jsi z nebeské klenby
    obklopena anděly
    též měl jsem vizi sexu
    lásky v blesku fotoaparátu
    nahá stehna
    čínská varlata bublala na sopečné naději
    vibrovala stínem a sluncem
    a já do tebe vrcholil
    vrcholil se slzami v očích

- title: "SMRTELNĚ VÁŽNĚ: kdo přijde když ne ty?"
  text: |
    kdo přijde když ne ty?
    navštíví mě Ježíš?
    symbolika
    vláček jede dítě kliká
    na pranic a d'or panika
    vyberte syžety
    kam k***a běžíš?
    erby z ebenu

- title: "SMRTELNĚ VÁŽNĚ: krmě - listopadový sníh"
  text: |
    krmě - listopadový sníh
    jenž ti pokryl lůno
    je ze mě obžera
    kozel s rapidní škálou přemetů
    a potřeb

- title: "SMRTELNĚ VÁŽNĚ: Rajský ostrov"
  text: |
    /zpěv vrchního nádvorního v předvečer své smrti/

    a jestli jsme někdy
    něco spolu měli
    bylo to dávno
    a čas mi tě skryl

    pohybuješ-li se
    mezi všemi těly
    jak tě mám najít?
    hrdou z černých víl

    ději se jak plamen
    ne a ne se vejít
    do tmy žluté
    kde se Pámbu zpil

    tak jestli jsme někdy
    něco spolu měli
    sperma voda amen
    chrání bezcenné

    čas se uvelebil
    na nočníku děcka
    hraj si s Plutem
    v galaxii
    jako škvoři zelené

    ten rajský ostrov
    jen my dva na něm
    byt vprostřed paneláků
    já jsem těhotná
    nevadí vzal z ohně hořící klacík
    a vpíchl jí ho do vagíny
    za jejího řevu
    s hořčicí klasik
    cejch na stěnách sliznice
    ten rajský ostrov
    toto bolí
    jako šílenství
    zdi jsou neprostupné
    jsme spolu lásko
    jen my dva
    po potratu
    v tomto těle
    do prde***e
    svatý klére

    zvuk varhan
    čejky to nedávaj'

- title: "SMRTELNĚ VÁŽNĚ: ve věku bezprecedentních krizí"
  text: |
    ve věku bezprecedentních krizí
    ve věku mývalů bez mýdla
    ve světě tak pustém
    jak jen duše může být
    prázdná srdce si podávají ruce plné vztekliny a zákysu
    plné štětin a broků
    ubrousků použitých
    vlašského salátu a salámu s peřím
    zalarmujte duchovní bytosti
    zesynchronizujte paví křiky
    protože tento dům padá
    aby už nikdy nepovstal z popela

    je smrtelný den
    panoptikum tužeb se nekoná
    zrůdy odřekly účast
    a sportovci nabodnutí na kůlu v déčkových filmech podávají svědectví o Božím stvoření
    o lidech utopených ve svém strachu
    o plasticitě sít rozumu
    a citu mrtvém po okraj

    ano poustevníci ruší cesty
    letadla jsou přelidněná
    a život uvadá jak povaha římských platidel
    za něž muž z hochem kráčí za hranice

    toto psal Nero
    dřív než vyšla brána
    potom nebylo nač tisknout
    kaligrafie rozrostla se do explicitních rozměrů
    TOTO PSAL NERO
    a Seneca byl zbaven těla
    pro diskuzi o prapožitcích
    mezi něž patří smrt

- title: "SMRTELNĚ VÁŽNĚ: My Way"
  text: |
    teď vím
    co měl jsem s tím
    který mi řek
    to všechno zvládnem
    ta síň
    olanzapin
    na srdci flek
    říkal sis Pane

    teď sám
    a přesto pln
    jím plody vln
    co nesou zkázu
    však tam
    kde končí kraj
    tam byl to záhul

    nic moc
    jen sarkasmus
    a kopretin
    útulná náruč
    je noc
    a strach a hnus
    svět ojetin
    též cílím k stáru

    a vším
    tím prokletím
    že tehdy spad'
    co ten si zkusil
    teď spí
    jen spusť se spusť
    bude to záhul

    //: dávnověká
    idyla blít
    o koních snít
    a dát jim ovsa
    záhul to byl
    vlak nečekal
    jen slova sprostá ://

- title: "SMRTELNĚ VÁŽNĚ: den je dlouhý"
  text: |
    den je dlouhý
    jako ruce modlářů
    varlata brzy prasknou
    ve světě kde meditují opice
    přišla Eva ke klice
    a bez zaťukání vstoupila

- title: "SMRTELNĚ VÁŽNĚ: básník je ten kdo není"
  text: |
    básník je ten kdo není
    a v něm je vše
    vše co se děje skrze Boha
