product_id: poetrystream_kozni_ambulance
title: Kožní ambulance
poems:
- title: "KOŽNÍ AMBULANCE: Teplouši"
  text: |
    neumím Bože nacenit co mi dáváš
    chtěl bych městem chodit nahý
    mít zas to krásné tělo sedmnácti let
    na padrť rozbitý je svět
    jejž kdysi miloval jsem
    nezbylo nic
    nic bez přívlastků a přece něco
    červené slipy s logem pornoworld
    bylo to kdysi dávno
    kdy jsem potkal jeho
    voněl mi a byl tak tělnatý
    dužiny svalů hrály na něm Dětský sen
    jak složil ho pan Beethoven
    tenkrát mu bylo patnáct
    nezajímaly mě čtrnáctky teenky jako teď
    kdy je mi ubohých čtyřicet
    a žiji ve městě s ocasem hlenu s krví z plic
    ó díky že ses odstěhovala
    na opačný konec republiky
    že pocítil jsem tvoje rtíky
    tvoje opojení
    a někde mezi knihami ležel tehdy on
    já neznal jsem ho
    jen vím
    že oba jsme měli jména s karmickou zátěží
    pamatuji si
    kdy jsme zhulení blbli na Petříně
    a v bystřinách prachu plnil se náš sen
    tehdys mi utekla
    a soustružník mu spravil ucho
    ó Petro proč jsi ťala?
    vysál jsem mu z pyje všechnu bolest
    vymačkak jsem z něj roli v parlamentu
    a za tónů Franckovy symfonie utichl čas
    a prostor vzal roha
    strach
    nikdy jsem neměl strach
    a když jsem byl s ní
    říkal jsem jí
    že budeme mít dům plnej krásnejch nahejch služebnic
    ve všem byla lež a úskoky
    jen já žil v pravdě věřte mi
    když mi ho kouřil
    viděl jsem Pannu Marii
    varlata pustila sémě
    ... quam olim Abrahae promisisti
    ty slipy mám dodnes
    už by ses do nich nevlezl
    tak jako já do trenýrek odtamtud
    toho času mrtví
    něco se zlomilo
    snad život pod naší prdelí
    naší společnou prdelí
    kde jsme hrávali tenis
    kurty věčně obsazené
    pivo a klobása
    a věčná pomoc zpěvákům se špatným koncem
    každá koupená deska je requiem
    jež jim pomáhá z očistce
    a každý přehraný vinyl je volá zpět na Zemi
    jste si jistí že to tak není?
    jsi si jistá že NIC nebylo?
    zažilas někdy něco silnějšíno?
    najdi si ženskou proboha
    máš mnoho darů
    ale vytvořit přátelské prostředí nedokážeš
    všude byla lež
    všude kolem
    jenom já byl čistý jak mladý komunista
    a potom ta studentská kolej
    byla prokletá
    a mlčení mezi námi se prohlubovalo do dopisů
    a taky si vzpomínám na metro
    - ten podzemní kostel
    líbali jsme se tam
    dva kluci
    dva teplouši
    dvě buzny
    a ještě jiná svatá slova se snášela na naše hlavy
    a tam v tom metru jsem tě z okna vozu viděl v objetí s lesbou K.
    měla tehdy deprese
    žila též na těch prokletých kolejích
    budeme lásko
    budeme každý sám
    byť obraz ztratil rám
    domalováno není
    jsem v poruše
    a pro tebe jen kdysi zajímavá kapitola
    a já nahý v lese
    v provizorním ohništi nechám shořet.
    ony červené slipy
    opřený o strom onanuje
    a vím že se sám neudělám
    ale je mi to jedno
    protože tam někde čeká
    Freddie Jim a Kurt

- title: "KOŽNÍ AMBULANCE: Válka"
  text: |
    sešli se
    by zvrátili osud slov
    a moře černé jako horník zpívalo Bohem
    utíkali frázím
    a řídili se hvězdami a čísly
    byli to oni kdo vymlčeli svět
    pamatuj na Hitlera
    zlo krystalické v hnědé obuvi
    na dubu sedí pták Jenisej
    a střed je v útisku
    andělé vykonali potřebu
    a krávy natrávily ta zbožná přání
    úder!
    vymykající se smlouvám a paktům
    Prostá Udatná Tichá Ingrid Necukla
    a tak nezvrátili ale převrátili a zprasili osud slov
    démoni blaha
    účtenky z mládí
    kus praxe s bláznivými teoriemi
    v kapse mrakodrapy
    v hlavě jíl
    a motýli a hýl tu nepatří
    když týlem kráčí týl
    a kýl se zasekl do břehu
    jako když zakousneš nasyrovo myš
    šedohnědou myš s hracími kostkami
    nebe je v úsvitu
    nebe je pod námi
    a křik zraněných vojáků
    jimž není pomoci
    je intarzií manifestu hrdinství
    loudám se krajinou
    Ukrajinou na střepy rozbitou
    a cítím temný žár
    jak lepí se mi na paty
    spolu s Evropou
    modrožlutá bajko
    obstojíš před další generací studentů historie?
    a budeme se smát?
    budeme se zase smát?
    jen děti nerozumí
    jen děti nás přežijí
    jen děti rozum a bída
    a šachovnice moci
    tam pod hvězdami a čísly
    
- title: "KOŽNÍ AMBULANCE: Na parte"
  text: |
    chobotnici vypovědělo třetí srdce
    letci jsou v pohybu
    tajemství oceánu
    Antoine Newage to pořád zkouší
    a milióny zkouší věřit
    chobotnici vypovědělo i druhé srdce
    šneci kráčí jako jeden muž
    šneci jdoucí na porážku, na kříž
    nebe se pohlo
    ústřice telefonují
    výborný zrak a zvědavost
    chobotnici vypovědělo i poslední srdce
    setkání s choboanděly
    úzkostné stavy krát osm
    ubohé úmrtí
    snad jen Bonaparte ví

- title: "KOŽNÍ AMBULANCE: Vzkříšenému"
  text: |
    nevěřím že mě ještě někdy někdo bude milovat
    bezpodmínečně jako Ty Pane
    nevěřím v lásku
    jen v pudy soucitu
    jen v pudy mateřské
    a pudy pláče a smíchu
    otroci vlastních endokrinních žláz
    otroci mozků a pravidel
    pasáci citů
    žoldnéři sebevrazi ubožáci
    koňské zadky
    pijavice
    manipulanti
    Pane proč jsi to udělal?
    stálo Ti to zato?
    nikdy to nepochopím
    protože nemám lásku
    protože jenom láska chápe
    a já nerozumím
    zabil jsem Simona Clinea
    zabiji i Čeňka Bílého
    přijmi jejich popel jako zápalnou oběť díků
    díků které jsou možná také jenom pudy

- title: "KOŽNÍ AMBULANCE: Už mě to neba"
  text: |
    uplatit vesmír hloupostmi
    zaříkávat
    mlžit
    každý den svinout do nekonečna
    to se vážně musí?

- title: "KOŽNÍ AMBULANCE: Slušné maso"
  text: |
    pouliční rasa
    branci z NASA
    válka mír a lháři
    ozbrojeni? stářím

    co že děláš pysky?
    syfilistky za čtyřlístky nepůjdou
    ani do kina
    hů to je konina

- title: "KOŽNÍ AMBULANCE: Co udělám"
  text: |
    sním si svůj azbestový sen
    a lidé hovoří o zvěři a tak
    a já si hraji na svém hřišti
    hřišti golfovém
    občas pozvu dechový ansámbl
    a ten přímo vprostřed hřiště spustí Love of My Life
    pak volám baskytaristovi
    on přijede
    a společně pak provedou Riders On the Storm
    a lidi přitom máchají holemi
    občas nějaký míček zraní muzikanta
    ale to už je úděl míčku
    kovový trávník věští tmu a bouři
    značkové oblečení pozbylo značku
    na světě být jen na střídačku
    a hledat kus pole a oráče
    prodám svůj golfový plac
    zapomenu kdo nejsem
    doženou mě úzkosti
    a dlaha smrti
    neopustím se
    neopustím se pro lásku Boží
    stanu se pluhem pozemským
    a obrátím zemi vzhůru nohama
    na kterých klečí a klečím i já
    muzikanti dohráli
    dostali zaplaceno
    odešli
    odjeli auty s levným nátěrem
    a hřiště chátrá
    jednou se promění v prales
    a nikdo neuvěří
    že tady kdysi básník hrál golf

- title: "KOŽNÍ AMBULANCE: Anna"
  text: |
    moc ti to slušelo
    a provonělas celý pokoj
    ještě pár minut poté co jsi odešla
    jsem v něm stál se zavřenýma očima
    a vdechoval to co po tobě zbylo

    vážně ti to moc seklo
    a já ti to nemohl říct
    abych z tebe měl alespoň to co mi můžeš dát

    a tak zůstáváš mým dobře utajeným snem
    rozpuštěným v poezii všedního dne
    v odporné samotě
    v kávové znouzectnosti
    v nemoci duše
    ve výtvarnu Stvořitele
    v celém tom prokletém smutku

    chci tě zas vidět
    ale nesmíš být při tom
    kvůli mně
    kvůli sobě
    kvůli němu

- title: "KOŽNÍ AMBULANCE: Odcizení"
  text: |
    kouká na mě z vany
    kapr křižovaný
    kapří láska
    táta mlaská
    a duch - v pruhovaných
    maskách

    všechny světské duhy
    stály za neduhy
    rybí očka
    k vločce vločka
    kdo zaplatí cizí dluhy?
    kočka?

- title: "KOŽNÍ AMBULANCE: Femme fatale"
  text: |
    jak se to stalo že zemřela
    bez zaplacení alžírské kávy?
    prokráčím stáří a docela
    tiše si brouknu motivek žhavý

    osudová...

    když jsem ji spatřil dávno již
    je tomu hřmotně spadl jsem z laťky
    že femme fatale je pro potíž
    tak jako pendrekem zmalovaný zadky

    spoutaný křičíš dost dost dost
    nic už tě nikdy nebude bavit
    myslÍš že svedeš spálit tento most?
    směji se voda kalí se a kov se taví

    vždyť jsi byl tak blízko
    ale nedotkl ses
    otrávené psisko
    skrylo vše se v slze

- title: "KOŽNÍ AMBULANCE: Vyznání"
  text: |
    pokaždé když ve mně zvracíš Bože
    rozumím Ti
    ale uvědom si
    že v těle ve kterém bydlím
    prostě nejde milovat
    a jak jdou roky
    je to horší a horší
    a dáváš mi to sežrat
    a pak nás oba bolí žaludek
    ve kterém mi ležíš zmučen mou nenávistí
    opovržením
    mou lhostejností
    tak zejtra jinak co Ty na to? chtělo by se říct
    ale ta věta končí v toaletním papíru
    a probuzení se tříští o útesy rovnic
    Bože nemohu Ti pomoct
    Tvůj Syn má těžké přetěžké tělo
    a ve mně se chechtá páv

- title: "KOŽNÍ AMBULANCE: Básník"
  text: |
    přitahoval si ji
    až jednou přišla sama
    požádat jej o otroctví
    o sladké otroctví
    které kryje Spidermany našich dob
    měla na něj dobrý vliv
    někdy i někoho neuřkl
    pracoval se sebou
    a přijal ji jako náplast na jednu z tisíce ran
    byla jak kancléř prezidenta veteše
    byla jen tím co si přál
    v obležení Bachových chorálů
    kdy každá báseň BYLA na první dobrou
    byla jeho tušením i snem

- title: "KOŽNÍ AMBULANCE: Nejen otázky"
  text: |
    kdo hlídá ovce
    když je ryba na suchu?
    kdo hledá lásku uvnitř naděje?
    život je symfonická věta
    jak gorila ve zlatě vyvedená
    úchvatná soška
    klaňme se
    život je plný turistických značek
    a hovna skrytá ve psí sáček
    skrytá tak že mrznou na sněhu
    nejde mi o něhu
    chci se jen nadechnout jak člověk
    nehlídat dítě uvnitř vlčích máků
    pln bolesti
    pln vztlaků
    pln otázky
    proč osiřelost mraků nezabrání dešti
    být jhem událostí
    jhem tónů
    bzukotem divokých včel
    inflací času
    zahraničním hostem v místě střetnutí tak citelné pravdy
    zrychlený dech
    a komár na tvých ňadrech
    ani ň
    a torzo umírání v zavazadlech
    v dopisech milenčiných
    v nádeších slepic
    a v toleranci moderních galerií
    andělé nespí
    žhnou
    a někde s princeznou Marií
    přichází na svět kříž

- title: "KOŽNÍ AMBULANCE: Lásko..."
  text: |
    ten umíněný den
    to umíněné dopoledne
    to světlo
    ten kahan smrti
    vrátí se chodbou milosti někdo
    kdo pochopí a utěší?
    Pane věřím
    s pokorou přistupuji k životu
    jenž mě znásilňuje
    jsem hloupý?
    odejít?
    vždyť...
    a ty lásko jsi jako ten život
    život jenž je slepý hluchý a upovídaný
    věřím
    že mlčky přijdeš a přestaneš mě trápit


- title: "KOŽNÍ AMBULANCE: Noc-nenoc"
  text: |
    když Slunce usíná v poloze želvy
    půjde to do nikam Slunce to žel ví
    chraplavým hlasem
    Měsíc sám sebe retušuje
    ke vší té zkáze
    tento zběh-nezběh
    rdí se
    zuje obočí
    hříchem proskočí
    je to jen ovoce
    které zčešeš z jabloní
    poslouchajíc ze Spotify
    operu s názvem Danke
    zreziví na smrt pan Kvér
    v tvé kapse
    v tvé paměti

- title: "KOŽNÍ AMBULANCE: Zakázaná láska"
  text: |
    sešli se narušená s narušeným
    ničemu nerozuměli
    nejvíc si z toho všeho pávů cením
    a sebevrahů z úst cely

    bylo to šílené jak draci v nebi
    zasazení jak kámen v prsten
    zdá se žes trumfem osud už už přebil
    však mýlka rozpustila
    se v přijímání bohapusté

    kam ztratila se síla?
    ledovcům tajemstvím dmou se ňadra
    a my dva skáčem svistem přes švihadla
    zadaná láska se
    zadaná láska se
    zadaná láska se dnes v noci nepostila

- title: "KOŽNÍ AMBULANCE: Stáří"
  text: |
    povadlé sněženky
    povadlá prsa
    hedvábné krajkoví
    smrt Jana Husa

    cena na trhu lásky klesá
    a všude stres a bída
    nikdy už neposnídáš
    tak jak včera

    pochopit povadlost
    hrdinský svěr a péra v gauči

    život tě učí a naučí

- title: "KOŽNÍ AMBULANCE: Stáří 2"
  text: |
    co bylo ve mně k něčemu
    teď k ničemu už není
    všechna ta adorace
    výlučnost snění
    všechna ta práce zbytečná
    na motivy Krista
    třískat třískat třískat
    ta únava ta klišé
    kdo jaktěživ to slyšel
    kráčejíc ve své pýše?
    a z ozonové lžíce rozum brát
    dostaneš celkem sedm rad
    z nichž dodržíš jen pět
    zbydou jen ty a svět
    - témata nevděčná a lichá
    ach dýchat dýchat dýchat
    já tě nemiluji
    já tě nemám rád
    živote jsme si kvit
    je ustláno
    jdem spát